; The Dreaming Clock — PlatformIO configuration
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-devkitm-1

; ---------------------------------------------------------------------------
; Shared build settings
; ---------------------------------------------------------------------------
[common]
build_flags =
	-Wall
	-DOTA_PASSWORD=\"${sysenv.CLOCK_OTA_PASSWORD}\"

; ---------------------------------------------------------------------------
; Firmware
; ---------------------------------------------------------------------------
[env:esp32-c3-devkitm-1]
platform = espressif32@6.11.0
board = esp32-c3-devkitm-1
framework = arduino

board_build.filesystem = littlefs
; 1.625 MB app slots + 640 KB LittleFS. Requires a one-time USB flash: OTA
; cannot rewrite the partition table. See partitions.csv.
board_build.partitions = partitions.csv

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Every dependency is pinned. Nothing may resolve from the global
; ~/.platformio/lib store, or a fresh clone will not build.
lib_ldf_mode = chain+
lib_deps =
	fastled/FastLED@^3.10.3
	mathieucarbou/ESPAsyncWebServer@^3.6.0
	mathieucarbou/AsyncTCP@^3.3.2
	adafruit/RTClib@^2.1.4
	adafruit/Adafruit BusIO@^1.17.4
	bblanchon/ArduinoJson@^7.4.2

build_flags =
	${common.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

extra_scripts = pre:scripts/build_web.py

; OTA upload:  pio run -e esp32-c3-devkitm-1 -t upload --upload-port the-dreaming-clock.local
; (the OTA password comes from $CLOCK_OTA_PASSWORD, see README)

; ---------------------------------------------------------------------------
; Host-side unit tests for the Arduino-free logic (patterns, schedule).
;   pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
	-std=gnu++17
	-Wall
	-I src
build_src_filter = +<patterns.cpp> +<schedule.cpp> +<dreams.cpp> +<animation.cpp>
