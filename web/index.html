<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Dreaming Clock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="stage">
    <nav class="topbar">
      <span id="ws-dot" class="live-dot" role="status" aria-label="Connection"></span>

      <button
        id="calibrate-button"
        class="icon-button"
        type="button"
        aria-pressed="false"
        aria-label="Calibrate LED order"
        title="Calibrate LED order"
      >
        <!-- A strip of LEDs with one lit: what the calibration walk does. -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="3.5" cy="12" r="1.6" />
          <circle cx="9" cy="12" r="1.6" />
          <circle cx="14.5" cy="12" r="1.6" class="filled" />
          <circle cx="20" cy="12" r="1.6" />
          <path d="M14.5 6.5v2M14.5 15.5v2" />
        </svg>
      </button>

      <a class="icon-button" href="/settings.html" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 3v6.2M5 14.8V21M12 3v3.2M12 11.8V21M19 3v9.2M19 17.8V21" />
          <circle cx="5" cy="12" r="2.4" />
          <circle cx="12" cy="9" r="2.4" />
          <circle cx="19" cy="15" r="2.4" />
        </svg>
      </a>
    </nav>

    <!-- The clock is the control: tapping it wakes it up. -->
    <button id="preview" class="clock" type="button" aria-label="Show the time now"></button>

    <p id="readout" class="readout" hidden></p>

    <script type="module" src="index.js"></script>
  </body>
</html>
