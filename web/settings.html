<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clock Settings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>⏰ Clock Settings</h1>

      <section class="card">
        <h2>Time</h2>
        <div id="time-info" class="info-box"></div>
        <div class="form-row">
          <label for="timezone">Timezone</label>
          <select id="timezone" class="select"></select>
        </div>
        <button id="save-timezone" class="btn btn-small">Save Timezone</button>
        <span id="tz-status" class="status"></span>

        <hr />

        <p class="hint">
          The clock syncs from NTP automatically when connected to a network.
          Set it by hand only when running as an access point.
        </p>
        <div class="form-row">
          <input type="number" id="hours" placeholder="HH" min="0" max="23" class="numbers" />
          <span class="divider">:</span>
          <input type="number" id="minutes" placeholder="MM" min="0" max="59" class="numbers" />
        </div>
        <div class="form-row">
          <input type="number" id="day" placeholder="DD" min="1" max="31" class="numbers small" />
          <span class="divider">.</span>
          <input type="number" id="month" placeholder="MM" min="1" max="12" class="numbers small" />
          <span class="divider">.</span>
          <input type="number" id="year" placeholder="YYYY" min="2020" max="2099" class="numbers" />
        </div>
        <button id="use-browser-time" class="btn btn-small">📱 Use Browser Time</button>
        <button id="save-time" class="btn">Save Time</button>
        <span id="time-status" class="status"></span>
      </section>

      <section class="card">
        <h2>Display</h2>
        <p class="hint">Currently: <strong id="current-mode">—</strong></p>
        <div class="button-row">
          <button class="btn btn-small" data-mode="dream">Dream</button>
          <button class="btn btn-small" data-mode="pattern">Patterns</button>
          <button class="btn btn-small" data-mode="wakeup">Show Time</button>
        </div>
        <span id="mode-status" class="status"></span>

        <hr />

        <div class="form-row slider-row">
          <label for="brightness">Time brightness</label>
          <input type="range" id="brightness" min="0" max="255" />
          <output id="brightness-value">—</output>
        </div>
        <div class="form-row slider-row">
          <label for="dreamBrightness">Dream brightness</label>
          <input type="range" id="dreamBrightness" min="0" max="255" />
          <output id="dreamBrightness-value">—</output>
        </div>
        <button id="save-brightness" class="btn">Save Brightness</button>
        <span id="brightness-status" class="status"></span>
      </section>

      <section class="card">
        <h2>Active Hours</h2>
        <div class="form-row">
          <label class="toggle">
            <input type="checkbox" id="activeHoursEnabled" />
            <span>Enable Active Hours</span>
          </label>
        </div>
        <div id="activeHoursConfig">
          <table class="schedule-table">
            <thead>
              <tr><th>Day</th><th>Active</th><th>Start</th><th>End</th></tr>
            </thead>
            <tbody id="day-rows"></tbody>
          </table>
        </div>
        <button id="save-active-hours" class="btn">Save Active Hours</button>
        <span id="active-status" class="status"></span>
      </section>

      <section class="card">
        <h2>Auto Wakeup</h2>
        <p class="hint">How often the clock shows the time by itself.</p>
        <select id="wakeupInterval" class="select">
          <option value="0">Off</option>
          <option value="5">Every 5 minutes</option>
          <option value="15">Every 15 minutes</option>
          <option value="30">Every 30 minutes</option>
          <option value="60">Every hour</option>
          <option value="120">Every 2 hours</option>
          <option value="180">Every 3 hours</option>
          <option value="240">Every 4 hours</option>
          <option value="360">Every 6 hours</option>
        </select>
        <button id="save-wakeup" class="btn">Save Interval</button>
        <span id="wakeup-status" class="status"></span>
      </section>

      <section class="card">
        <h2>📶 Network</h2>
        <div id="network-info" class="info-box"></div>
        <div class="form-row">
          <label for="networkMode">Mode</label>
          <select id="networkMode" class="select">
            <option value="0">Captive Portal (Access Point)</option>
            <option value="1">WiFi Client</option>
          </select>
        </div>
        <div id="clientConfig">
          <div class="form-row">
            <label for="wifiSSID">SSID</label>
            <input type="text" id="wifiSSID" placeholder="Network name" maxlength="32" />
          </div>
          <div class="form-row">
            <label for="wifiPassword">Password</label>
            <input type="password" id="wifiPassword" placeholder="Leave empty to keep current" maxlength="64" />
          </div>
          <div class="form-row">
            <label class="toggle">
              <input type="checkbox" id="fallbackEnabled" />
              <span>Fall back to Captive Portal if the connection fails</span>
            </label>
          </div>
        </div>
        <div class="form-row">
          <label class="toggle">
            <input type="checkbox" id="applyNow" checked />
            <span>Apply immediately</span>
          </label>
        </div>
        <button id="save-network" class="btn">Save Network Settings</button>
        <span id="network-status" class="status"></span>
      </section>

      <div class="center"><a href="/" class="link">← Back</a></div>
    </div>
    <script type="module" src="settings.js"></script>
  </body>
</html>
